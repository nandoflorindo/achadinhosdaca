<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achadinho da Cá | Ofertas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
            padding: 20px; color: white;
        }

        .container { 
            width: 100%; max-width: 450px; text-align: center; 
        }

        /* Estilo da capa */
        .cover-img { 
            width: 100%; border-radius: 15px; margin-bottom: 20px; 
            border: 2px solid rgba(255,255,255,0.1);
        }

        h1 { margin-bottom: 5px; font-size: 1.5rem; }
        p { margin-bottom: 25px; color: #a1a1aa; font-size: 0.9rem; }

        .btn { 
            display: block; width: 100%; padding: 18px; margin: 12px 0; 
            text-decoration: none; color: white; border-radius: 12px; 
            font-weight: bold; transition: 0.3s;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        /* Botão Destaque */
        .btn-primary { 
            background: linear-gradient(45deg, #e94560, #ff5e78);
            border: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(233, 69, 96, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); }
        }

        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <img src="capa.jpeg" alt="Capa" class="cover-img">
        
        <h1>Achadinho da Cá</h1>
        <p>Ofertas diárias selecionadas para você!</p>
        
        <a href="LINK_DO_SEU_GRUPO" class="btn btn-primary">🔥 Entrar no Grupo VIP (Ofertas)</a>
        <a href="URL_INSTAGRAM" class="btn">Instagram</a>
        <a href="URL_SITE" class="btn">Site Oficial</a>
    </div>
</body>
</html>
