    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
            padding: 20px; color: white;
        }

        .container { 
            width: 100%; max-width: 450px; text-align: center; 
        }

        .cover-img { 
            width: 100%; border-radius: 15px; margin-bottom: 20px; 
            border: 2px solid rgba(255,255,255,0.1);
        }

        h1 { margin-bottom: 5px; font-size: 1.5rem; }
        p { margin-bottom: 25px; color: #a1a1aa; font-size: 0.9rem; }

        .btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 18px; margin: 12px 0; 
            text-decoration: none; color: white; border-radius: 12px; 
            font-weight: bold; transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn-primary { 
            background: linear-gradient(45deg, #e94560, #ff5e78);
            border: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(233, 69, 96, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); }
        }

        .btn:hover { 
            background: rgba(255, 255, 255, 0.15); 
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
